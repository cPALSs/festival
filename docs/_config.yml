title: Festival Season Network
tagline: Open toolkit for Lunar New Year & Autumn festival organizers<br>Greater Sacramento and beyond
description: Open toolkit for Lunar New Year and Autumn festival organizers — auspicious date picker, weather risk monitor, food menu curator, and season coordination playbooks.
theme: jekyll-theme-cayman
repository: cPALSs/festival
baseurl: ""
url: "https://festival.cpalss.com"

header_pages:
  - index.md
  - getting-started.md
  - google-workspace-mcp.md
  - google-sheets-mcp.md
  - principles.md
  - research.md
  - plan-with-ai.md
  - lny/market-research.md
  - child-audience/overview.md
  - tone-of-voice.md

markdown: kramdown

kramdown:
  auto_ids: true
  auto_id_stripping: true

plugins:
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: default
