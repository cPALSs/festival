<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Festival Season Network OG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1024px;
    height: 536px;
    overflow: hidden;
    font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .card {
    width: 1024px;
    height: 536px;
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    padding: 3rem 4rem;
    background-color: #159957;
    background-image: linear-gradient(120deg, #155799, #159957);
  }
  .name {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  .tagline {
    font-size: 24px;
    font-weight: 400;
    line-height: 1.4;
    opacity: 0.95;
    max-width: 40rem;
    text-wrap: balance;
  }
  .nav {
    display: flex;
    gap: 1.5rem;
    margin-top: 0.85rem;
    font-size: 18px;
    font-weight: 600;
    opacity: 0.92;
  }
  .nav span {
    border-bottom: 2px solid rgba(255,255,255,0.85);
    padding-bottom: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="name">Festival Season Network</div>
    <div class="tagline">Open toolkit for festival organizers — Greater Sacramento and beyond</div>
    <div class="nav" aria-hidden="true">
      <span>Home</span>
      <span>About</span>
      <span>Toolkit</span>
      <span>Reports</span>
    </div>
  </div>
</body>
</html>
